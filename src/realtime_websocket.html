<!DOCTYPE html>
<html>
<head>
    <title>Agent IA - Temps Réel</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial; margin: 20px; background: #f0f0f0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .chat { height: 400px; border: 1px solid #ddd; padding: 10px; overflow-y: auto; margin: 10px 0; background: #fafafa; }
        .message { margin: 10px 0; padding: 8px; border-radius: 5px; }
        .user { background: #e3f2fd; text-align: right; }
        .ai { background: #f3e5f5; }
        .transcript { background: #fff3e0; font-style: italic; }
        .controls { text-align: center; margin: 20px 0; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .record { background: #4caf50; color: white; }
        .stop { background: #f44336; color: white; }
        .status { margin: 10px 0; font-weight: bold; }
        input { width: 300px; padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Agent IA - Discussion Temps Réel</h1>
        
        <div>
            <input type="text" id="backendUrl" placeholder="URL Backend (ex: https://abc123.ngrok.io)" value="">
            <button onclick="connect()">Se connecter</button>
        </div>
        
        <div class="status" id="status">Déconnecté</div>
        
        <div class="chat" id="chat"></div>
        
        <div class="controls">
            <button id="recordBtn" class="record" onclick="toggleRecording()">🎤 Commencer</button>
            <button onclick="clearChat()">Effacer</button>
        </div>
    </div>

    <script>
        let ws = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let silenceTimer = null;
        let currentTranscript = '';

        function addMessage(text, type) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function connect() {
            const url = document.getElementById('backendUrl').value;
            if (!url) {
                alert('Entrez l\'URL du backend');
                return;
            }

            const wsUrl = url.replace('http', 'ws') + '/ws';
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus('✅ Connecté au backend');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'transcript') {
                    currentTranscript = data.text;
                    addMessage(`Vous: ${data.text}`, 'transcript');
                } else if (data.type === 'response') {
                    addMessage(`IA: ${data.text}`, 'ai');
                }
            };

            ws.onclose = () => {
                updateStatus('❌ Déconnecté');
            };

            ws.onerror = (error) => {
                updateStatus('❌ Erreur de connexion');
                console.error('WebSocket error:', error);
            };
        }

        async function toggleRecording() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Connectez-vous d\'abord au backend');
                return;
            }

            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    sendAudio(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                
                document.getElementById('recordBtn').textContent = '🛑 Arrêter';
                document.getElementById('recordBtn').className = 'stop';
                updateStatus('🎤 Enregistrement...');

                // Auto-stop après 10 secondes max
                setTimeout(() => {
                    if (isRecording) {
                        stopRecording();
                    }
                }, 10000);

            } catch (error) {
                console.error('Erreur micro:', error);
                alert('Impossible d\'accéder au microphone');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                
                document.getElementById('recordBtn').textContent = '🎤 Commencer';
                document.getElementById('recordBtn').className = 'record';
                updateStatus('⏳ Traitement...');
            }
        }

        async function sendAudio(audioBlob) {
            try {
                const arrayBuffer = await audioBlob.arrayBuffer();
                const base64 = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
                
                ws.send(JSON.stringify({
                    type: 'audio',
                    data: base64
                }));
                
            } catch (error) {
                console.error('Erreur envoi audio:', error);
                updateStatus('❌ Erreur envoi');
            }
        }

        function clearChat() {
            document.getElementById('chat').innerHTML = '';
        }

        // Auto-connect si URL dans localStorage
        window.onload = () => {
            const savedUrl = localStorage.getItem('backendUrl');
            if (savedUrl) {
                document.getElementById('backendUrl').value = savedUrl;
            }
        };

        // Sauvegarder URL
        document.getElementById('backendUrl').onchange = (e) => {
            localStorage.setItem('backendUrl', e.target.value);
        };
    </script>
</body>
</html>
