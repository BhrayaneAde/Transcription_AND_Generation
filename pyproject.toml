[project]
name = "fastrtc-groq"
version = "0.1.0"
description = "A simple voice agent using FastRTC and Groq"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastrtc[vad]>=0.0.19",
    "groq>=0.22.0",
    "numpy>=2.1.3",
    "langgraph>=0.1.18",
    "langchain-core>=0.1.29",
    "langchain-groq>=0.1.5",
    "loguru>=0.7.3",
    "python-dotenv>=1.1.1",
    "pyttsx3",
    "transformers>=4.56.1",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "openai-whisper>=20250625",
    "accelerate>=1.10.1",
    "gtts>=2.5.4",
    "pygame>=2.6.1",
    "faster-whisper>=1.2.0",
    "requests>=2.32.3",
    "pydub>=0.25.1",
    "ollama>=0.5.4",
    "edge-tts>=7.2.3",
]
